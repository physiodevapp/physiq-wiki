name: Deploy to PhysiQ hub

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout physiq-wiki
        uses: actions/checkout@v4

      - name: Checkout physiq hub
        uses: actions/checkout@v4
        with:
          repository: physiodevapp/physiq
          token: ${{ secrets.PHYSIQ_DEPLOY_TOKEN }}
          path: physiq-hub

      - name: Copy files to hub
        run: |
          rm -rf physiq-hub/wiki
          mkdir -p physiq-hub/wiki
          cp index.html app.js data.js physiq-hub/wiki/
          [ -d images ] && cp -r images physiq-hub/wiki/
          sed -i 's|src="app.js"|src="app.js?v=${{ github.sha }}"|' physiq-hub/wiki/index.html
          sed -i 's|src="data.js"|src="data.js?v=${{ github.sha }}"|' physiq-hub/wiki/index.html

      - name: Commit and push
        working-directory: physiq-hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A wiki/
          git diff --cached --quiet || git commit -m "chore: update wiki from physiq-wiki@${{ github.sha }}"
          git push
